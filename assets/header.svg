<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Ali Can Ayhan — AI / LLM Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="220" rx="18"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .dot  { animation: float 6s ease-in-out infinite; }
      .d2   { animation-delay: -2s; } .d3 { animation-delay: -4s; }
      @keyframes float { 0%,100% { transform: translateY(0); opacity: .35 } 50% { transform: translateY(-14px); opacity: .8 } }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <!-- floating "neurons" -->
    <g fill="#a78bfa">
      <circle class="dot"    cx="760" cy="60"  r="5"/>
      <circle class="dot d2" cx="820" cy="120" r="4"/>
      <circle class="dot d3" cx="700" cy="150" r="6"/>
      <circle class="dot d2" cx="850" cy="45"  r="3"/>
      <circle class="dot"    cx="660" cy="80"  r="3"/>
    </g>
    <g stroke="#a78bfa" stroke-opacity=".25" stroke-width="1.5">
      <line x1="760" y1="60" x2="820" y2="120"/>
      <line x1="820" y1="120" x2="700" y2="150"/>
      <line x1="700" y1="150" x2="660" y2="80"/>
      <line x1="660" y1="80" x2="760" y2="60"/>
      <line x1="760" y1="60" x2="850" y2="45"/>
    </g>
  </g>

  <text x="48" y="58" class="mono" font-size="16" fill="#94a3b8">&gt;_ hello, world</text>
  <text x="48" y="112" class="sans" font-size="46" font-weight="800" fill="url(#name)">Ali Can Ayhan</text>

  <!-- cycling, typed subtitle (SMIL: reliable inside <img>) -->
  <clipPath id="c1"><rect x="48" y="135" height="40" width="0"><animate attributeName="width" values="0;560;560" keyTimes="0;0.12;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="48" y="162" class="mono" font-size="22" fill="#e2e8f0" clip-path="url(#c1)" opacity="0">AI / LLM Engineer 🤖<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.333;1" dur="12s" repeatCount="indefinite"/></text>
  <clipPath id="c2"><rect x="48" y="135" height="40" width="0"><animate attributeName="width" values="0;0;560;560" keyTimes="0;0.333;0.453;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="48" y="162" class="mono" font-size="22" fill="#e2e8f0" clip-path="url(#c2)" opacity="0">Building RAG systems &amp; agents 🧠<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.34;0.65;0.666;1" dur="12s" repeatCount="indefinite"/></text>
  <clipPath id="c3"><rect x="48" y="135" height="40" width="0"><animate attributeName="width" values="0;0;560;560" keyTimes="0;0.666;0.786;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="48" y="162" class="mono" font-size="22" fill="#e2e8f0" clip-path="url(#c3)" opacity="0">Shipping models to production 🚀<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.673;0.99;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="48" y="196" class="mono" font-size="14" fill="#67e8f9">● online <tspan class="cursor">▌</tspan></text>
</svg>
