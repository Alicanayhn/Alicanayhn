name: Profile metrics

on:
  schedule:
    - cron: "0 0 * * *" # 03:00 Europe/Istanbul
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: General stats (counts only, no repo names)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Alicanayhn
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Europe/Istanbul
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: update metrics [skip ci]"

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Alicanayhn
          filename: metrics-languages.svg
          template: classic
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Europe/Istanbul
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          committer_message: "chore: update language metrics [skip ci]"

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Alicanayhn
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
